<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="A transmission has been detected." />
  <title>UNIDENTIFIED SIGNAL</title>
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <canvas id="staticCanvas" aria-hidden="true"></canvas>
  <div class="snow" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="tear tear-one" aria-hidden="true"></div>
  <div class="tear tear-two" aria-hidden="true"></div>

  <main class="receiver" id="receiver">
    <div class="signal-copy" aria-live="polite">
      <p class="prelude" id="prelude">UNIDENTIFIED TRANSMISSION DETECTED</p>
      <p class="message" id="message">SOURCE UNKNOWN</p>
      <button id="receiveButton" type="button" aria-label="Begin receiving transmission">
        <span id="buttonText">RECEIVE SIGNAL</span>
      </button>
      <div class="meter" aria-hidden="true">
        <span id="meterFill"></span>
      </div>
      <p class="frequency" id="frequency">0000.0 kHz</p>
      <p class="scan-status" id="scanStatus">SCANNING AVAILABLE FREQUENCIES</p>
    </div>

    <div class="coordinates" aria-hidden="true">
      <span>35.2271° N</span>
      <span>80.8431° W</span>
      <span id="sequence">// 00:00:00 //</span>
    </div>
  </main>

  <p class="noscript">JavaScript is required to receive this transmission.</p>

  <audio id="song" preload="auto" loop>
    <source src="assets/chances-radio.mp3?v=4" type="audio/mpeg" />
  </audio>

  <audio id="germanSignal" preload="auto" loop aria-hidden="true">
    <source src="assets/german-transmission.mp3?v=2" type="audio/mpeg" />
  </audio>

  <script src="script.js?v=10"></script>
</body>
</html>
